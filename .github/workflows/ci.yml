name: Firmware Build & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (optional)"
        required: false
        default: "Manual trigger"

jobs:
  build:
    name: Build Firmware (ESP-IDF v5.5.4)
    runs-on: ubuntu-latest
    # Pin to exact IDF patch version that matches local dev environment.
    container: espressif/idf:v5.5.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Target and Download managed components
        run: |
          . /opt/esp/entrypoint.sh
          idf.py set-target esp32s3

      # esp-matter v1.6.0 has an unqualified PeerAddress reference in
      # esp_matter_controller_pairing_command.cpp that is ambiguous between
      # chip::Transport::PeerAddress and chip::Protocols::UserDirectedCommissioning::PeerAddress.
      # Locally it's masked by cached .obj files; in a clean CI build it fails.
      # Fix: fully qualify every bare PeerAddress occurrence in that file.
      - name: Patch esp-matter PeerAddress namespace ambiguity
        run: |
          PAIRING_CPP="managed_components/espressif__esp_matter/components/esp_matter_controller/commands/esp_matter_controller_pairing_command.cpp"
          if [ -f "$PAIRING_CPP" ]; then
            echo "Patching $PAIRING_CPP for PeerAddress namespace ambiguity..."
            # Qualify the bare PeerAddress type on line ~129
            sed -i \
              's/^\(\s*\)PeerAddress peerAddress = PeerAddress::UDP/\1chip::Transport::PeerAddress peerAddress = chip::Transport::PeerAddress::UDP/' \
              "$PAIRING_CPP"
            echo "Patch applied."
            grep -n "PeerAddress" "$PAIRING_CPP" | head -10
          else
            echo "WARNING: pairing_command.cpp not found — skipping patch."
          fi

      - name: Build Project
        run: |
          . /opt/esp/entrypoint.sh
          ninja -C build

      - name: Generate Merged Flash Binary
        run: |
          . /opt/esp/entrypoint.sh
          esptool.py --chip esp32s3 merge_bin \
            -o build/tapo-matter-display-merged.bin \
            --fill-flash-size 16MB \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x11000 build/ota_data_initial.bin \
            0x20000 build/tapo-matter-display.bin

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapo-matter-display-firmware
          path: |
            build/tapo-matter-display.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/tapo-matter-display-merged.bin
          if-no-files-found: error
