name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.4
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Target and Download managed components
        run: |
          . /opt/esp/entrypoint.sh
          idf.py set-target esp32s3

      - name: Patch esp-matter PeerAddress namespace ambiguity
        run: |
          PAIRING_CPP="managed_components/espressif__esp_matter/components/esp_matter_controller/commands/esp_matter_controller_pairing_command.cpp"
          if [ -f "$PAIRING_CPP" ]; then
            sed -i \
              's/^\(\s*\)PeerAddress peerAddress = PeerAddress::UDP/\1chip::Transport::PeerAddress peerAddress = chip::Transport::PeerAddress::UDP/' \
              "$PAIRING_CPP"
            echo "Patch applied."
          fi

      - name: Build Firmware
        run: |
          . /opt/esp/entrypoint.sh
          ninja -C build

      - name: Generate Merged Flash Binary
        run: |
          . /opt/esp/entrypoint.sh
          esptool.py --chip esp32s3 merge_bin \
            -o build/tapo-matter-display-merged.bin \
            --fill-flash-size 16MB \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x11000 build/ota_data_initial.bin \
            0x20000 build/tapo-matter-display.bin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "Release ${{ github.event.inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/tapo-matter-display.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/tapo-matter-display-merged.bin
          body: |
            ### 📦 Firmware Assets

            | Binary File | Description | Offset |
            | :--- | :--- | :--- |
            | `tapo-matter-display-merged.bin` | **Single all-in-one flashable image** | `0x0` |
            | `tapo-matter-display.bin` | Application binary | `0x20000` |
            | `bootloader.bin` | 2nd stage bootloader | `0x0` |
            | `partition-table.bin` | Custom 16MB partition table | `0x8000` |
            | `ota_data_initial.bin` | OTA data partition initial state | `0x11000` |

            ---

            ### ⚡ Quick Flashing Instructions

            #### Option A: Flash the all-in-one merged binary (Recommended)
            ```bash
            esptool.py --chip esp32s3 -p /dev/ttyACM0 -b 460800 write_flash 0x0 tapo-matter-display-merged.bin
            # On Windows:
            esptool.py --chip esp32s3 -p COM3 -b 460800 write_flash 0x0 tapo-matter-display-merged.bin
            ```

            #### Option B: Flash individual partitions
            ```bash
            esptool.py --chip esp32s3 -p COM3 -b 460800 write_flash \
              0x0 bootloader.bin \
              0x8000 partition-table.bin \
              0x11000 ota_data_initial.bin \
              0x20000 tapo-matter-display.bin
            ```
